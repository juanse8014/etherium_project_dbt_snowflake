version: 2

models:
  - name: stablecoin_activity_per_day
    latest_version: 2
    config:
      contract:
        enforced: true # Model protected by contract
        alias_types: true # Use alias types for columns
    columns:
      - name: date
        data_type: date

      - name: token_address
        data_type: varchar

      - name: type
        data_type: string
        data_tests:
          - accepted_values:
              arguments: # available in v1.10.5 and higher. Older versions can set the <argument_name> as the top-level property.
                values: ['Hybrid', 'Crypto-backed', 'Fiat-backed']

      - name: symbol
        data_type: varchar

      - name: total_usd_value
        data_type: float
    # Declare the versions, and highlight the diffs
    versions:
      - v: 1
        deprecation_date: 2027-01-01
        # Matches what's above -- nothing more needed
      - v: 2
        # Removed a column -- this is the breaking change!
        columns:
          # This means: use the 'columns' list from above, but exclude country_name
          - include: all
            exclude: [token_address, symbol]
      
